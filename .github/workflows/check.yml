name: Validate Wongo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate:print-kit
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:print
      - run: npm run generate:print-kit
      - run: git diff --exit-code -- public/downloads/pieces public/downloads/bambu public/downloads/puzzles src/data/dice-cards.json src/data/dice-puzzles.json
      - run: npm run generate:puzzles
      - run: git diff --exit-code -- src/data/puzzles.json src/data/validation.json
      - run: npm run export:rulebooks
      - run: git diff --exit-code -- public/downloads/rulebook-en.html public/downloads/rulebook-sk.html public/downloads/tacustav/rulebook-en.html public/downloads/tacustav/rulebook-sk.html

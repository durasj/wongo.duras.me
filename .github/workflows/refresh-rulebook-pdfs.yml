name: Refresh physical print assets
on:
  push:
    branches: [fix/clearance-centered-plates]
    paths:
      - scripts/**
      - src/data/print.json
      - docs/rulebook-en.md
      - docs/rulebook-sk.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    if: github.repository == 'durasj/wongo.duras.me' && github.ref == 'refs/heads/fix/clearance-centered-plates'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run generate:print-kit
      - run: npm run export:rulebook-pdfs
      - run: npm test && npm run test:browser && npm run test:print
      - name: Commit regenerated physical print assets and bilingual rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add src/data/dice-cards.json src/data/dice-puzzles.json public/downloads/pieces public/downloads/bambu public/downloads/puzzles public/downloads/rulebook-en.html public/downloads/rulebook-sk.html public/downloads/rulebook-en.pdf public/downloads/rulebook-sk.pdf public/downloads/tacustav/rulebook-en.html public/downloads/tacustav/rulebook-sk.html public/downloads/tacustav/rulebook-en.pdf public/downloads/tacustav/rulebook-sk.pdf
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate chamfered plates, physical D6 cards and bilingual rules"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:fix/clearance-centered-plates
